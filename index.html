<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Absensi Guru</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    // Masukkan URL Web App Google Apps Script kamu di sini
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDMZWc2p6K7JJWv8pVU0FdyKouVhoYb2DQaOcF8krbSg2MjTrGM1ELapI9JwfkZu2OSw/exec";

    // 1. Definisi Komponen App
    function App() {
      const [user, setUser] = React.useState(null);
      const [nip, setNip] = React.useState("");
      const [password, setPassword] = React.useState("");
      const [loading, setLoading] = React.useState(false);
      const [message, setMessage] = React.useState("");

      const [status, setStatus] = React.useState("Hadir");
      const [classId, setClassId] = React.useState("");
      const [lessonHour, setLessonHour] = React.useState("");
      const [jumlahHadir, setJumlahHadir] = React.useState("");
      const [materiOrAlasan, setMateriOrAlasan] = React.useState("");

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage("");
        try {
          const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=login&nip=${nip}&password=${password}`);
          const data = await res.json();
          if (data.status === "success") {
            setUser(data.user);
          } else {
            setMessage(data.message || "NIP atau password salah.");
          }
        } catch (err) {
          setMessage("Terjadi kesalahan koneksi ke server.");
        } finally {
          setLoading(false);
        }
      };

      const handleSubmitPresensi = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMessage("");

        const payload = {
          action: "addRecord",
          teacherName: user.name,
          subject: user.subject,
          status: status,
          classId: classId,
          lessonHour: lessonHour,
          jumlahHadir: jumlahHadir,
          materi: status === "Hadir" ? materiOrAlasan : "",
          alasan: status !== "Hadir" ? materiOrAlasan : ""
        };

        try {
          const res = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.status === "success") {
            setMessage("Presensi berhasil dikirim!");
            setClassId("");
            setLessonHour("");
            setJumlahHadir("");
            setMateriOrAlasan("");
          } else {
            setMessage("Gagal mengirim data.");
          }
        } catch (err) {
          setMessage("Terjadi kesalahan saat menyimpan.");
        } finally {
          setLoading(false);
        }
      };

      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white p-6 rounded-xl shadow-md w-full max-w-md animate-fade-in">
              <h2 className="text-2xl font-bold text-center mb-6 text-slate-800">Login Portal Guru</h2>
              {message && <div className="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">{message}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium mb-1">NIP</label>
                  <input 
                    type="text" 
                    value={nip} 
                    onChange={(e) => setNip(e.target.value)} 
                    className="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none" 
                    placeholder="Masukkan NIP" 
                    required 
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-1">Password</label>
                  <input 
                    type="password" 
                    value={password} 
                    onChange={(e) => setPassword(e.target.value)} 
                    className="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none" 
                    placeholder="Masukkan Password" 
                    required 
                  />
                </div>
                <button 
                  type="submit" 
                  disabled={loading} 
                  className="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-700 transition"
                >
                  {loading ? "Memproses..." : "Masuk"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-4 max-w-2xl mx-auto">
          <div className="bg-white p-6 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <div>
              <h1 className="text-xl font-bold text-slate-800">{user.name}</h1>
              <p className="text-sm text-slate-500">Mapel: {user.subject} | NIP: {user.nip}</p>
            </div>
            <button 
              onClick={() => setUser(null)} 
              className="text-xs text-red-600 border border-red-200 px-3 py-1.5 rounded-lg hover:bg-red-50"
            >
              Keluar
            </button>
          </div>

          <div className="bg-white p-6 rounded-xl shadow-md animate-fade-in">
            <h2 className="text-lg font-bold mb-4">Form Input Presensi & KBM</h2>
            {message && <div className="bg-emerald-100 text-emerald-700 p-3 rounded mb-4 text-sm">{message}</div>}

            <form onSubmit={handleSubmitPresensi} className="space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">Status Kehadiran</label>
                <select 
                  value={status} 
                  onChange={(e) => setStatus(e.target.value)}
                  className="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500"
                >
                  <option value="Hadir">Hadir Mengajar</option>
                  <option value="Izin">Izin</option>
                  <option value="Sakit">Sakit</option>
                </select>
              </div>

              {status === "Hadir" && (
                <>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium mb-1">Kelas</label>
                      <input 
                        type="text" 
                        value={classId} 
                        onChange={(e) => setClassId(e.target.value)} 
                        placeholder="Contoh: X IPA 1" 
                        className="w-full border rounded-lg p-2.5" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium mb-1">Jam Ke-</label>
                      <input 
                        type="text" 
                        value={lessonHour} 
                        onChange={(e) => setLessonHour(e.target.value)} 
                        placeholder="Contoh: 1-2" 
                        className="w-full border rounded-lg p-2.5" 
                        required 
                      />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium mb-1">Jumlah Siswa Hadir</label>
                    <input 
                      type="number" 
                      value={jumlahHadir} 
                      onChange={(e) => setJumlahHadir(e.target.value)} 
                      placeholder="Contoh: 32" 
                      className="w-full border rounded-lg p-2.5" 
                      required 
                    />
                  </div>
                </>
              )}

              <div>
                <label className="block text-sm font-medium mb-1">
                  {status === "Hadir" ? "Materi Pembelajaran" : "Alasan / Keterangan"}
                </label>
                <textarea 
                  value={materiOrAlasan} 
                  onChange={(e) => setMateriOrAlasan(e.target.value)} 
                  rows="3" 
                  className="w-full border rounded-lg p-2.5" 
                  placeholder={status === "Hadir" ? "Tuliskan materi KBM hari ini..." : "Tuliskan alasan..."} 
                  required 
                ></textarea>
              </div>

              <button 
                type="submit" 
                disabled={loading} 
                className="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-700 transition"
              >
                {loading ? "Menyimpan..." : "Kirim Presensi"}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // 2. Render React setelah App didefinisikan
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
