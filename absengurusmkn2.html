<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Absensi Guru</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX Compilation in Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDMZWc2p6K7JJWv8pVU0FdyKouVhoYb2DQaOcF8krbSg2MjTrGM1ELapI9JwfkZu2OSw/exec";
const SHEET_PRESENSI = "Presensi_dan_KBM";
const SHEET_GURU = "Data_Guru";

function setupSheets() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();

  // 1. Buat / Dapatkan Sheet Presensi dan KBM
  let sheetPresensi = ss.getSheetByName(SHEET_PRESENSI);
  if (!sheetPresensi) {
    sheetPresensi = ss.insertSheet(SHEET_PRESENSI);
    sheetPresensi.appendRow([
      "ID Record",
      "Waktu Catat",
      "Nama Guru",
      "Status Kehadiran",
      "Mata Pelajaran",
      "Kelas",
      "Jam Pelajaran",
      "Jumlah Hadir",
      "Materi / Alasan",
      "Foto Dokumentasi"
    ]);
    sheetPresensi.getRange("A1:J1").setFontWeight("bold").setBackground("#d1fae5");
  }

  // 2. Buat / Dapatkan Sheet Data Guru
  let sheetGuru = ss.getSheetByName(SHEET_GURU);
  if (!sheetGuru) {
    sheetGuru = ss.insertSheet(SHEET_GURU);
    sheetGuru.appendRow([
      "ID Guru",
      "NIP",
      "Nama Guru",
      "Mata Pelajaran Utama",
      "Password"
    ]);
    sheetGuru.getRange("A1:E1").setFontWeight("bold").setBackground("#d1fae5");

    // Data Sampel Guru
    sheetGuru.appendRow(["G001", "198503152010011002", "Drs. Ahmad Dahlan, M.Pd.", "Matematika", "123456"]);
    sheetGuru.appendRow(["G002", "198807222012022005", "Siti Nurhaliza, S.Pd.", "Bahasa Indonesia", "123456"]);
  }

  Logger.log("Berhasil menyiapkan tabel Google Sheets!");
}

function createJsonResponse(data) {
  return ContentService.createTextOutput(JSON.stringify(data))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  try {
    const action = e ? e.parameter.action : null;
    const ss = SpreadsheetApp.getActiveSpreadsheet();

    // Route 1: Mengambil Semua Data Presensi & Jurnal KBM
    if (action === "getRecords" || action === "getJournals") {
      const sheet = ss.getSheetByName(SHEET_PRESENSI);
      if (!sheet) return createJsonResponse({ status: "success", data: [] });

      const rows = sheet.getDataRange().getValues();
      rows.shift(); // Hapus header row

      const records = rows.map(r => ({
        id: r[0],
        createdAt: r[1],
        teacherName: r[2],
        status: r[3],
        subject: r[4],
        classId: r[5],
        lessonHour: r[6],
        jumlahHadir: r[7],
        materi: r[3] === 'Hadir' ? r[8] : '-',
        alasan: r[3] !== 'Hadir' ? r[8] : '-',
        photoUrl: r[9] || null
      }));

      return createJsonResponse({ status: "success", data: records.reverse() });
    }

    // Route 2: Validasi Login Guru
    if (action === "login") {
      const nip = e.parameter.nip;
      const pass = e.parameter.password;

      const sheet = ss.getSheetByName(SHEET_GURU);
      if (!sheet) return createJsonResponse({ status: "error", message: "Data guru belum diinisialisasi" });

      const rows = sheet.getDataRange().getValues();
      rows.shift();

      const found = rows.find(r => String(r[1]).trim() === String(nip).trim() && String(r[4]).trim() === String(pass).trim());

      if (found) {
        return createJsonResponse({
          status: "success",
          user: {
            id: found[0],
            nip: found[1],
            name: found[2],
            subject: found[3],
            avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=200'
          }
        });
      } else {
        return createJsonResponse({ status: "error", message: "NIP atau Kata Sandi salah" });
      }
    }

    return createJsonResponse({ status: "error", message: "Aksi GET tidak dikenal" });

  } catch (error) {
    return createJsonResponse({ status: "error", message: error.toString() });
  }
}

function doPost(e) {
  try {
    const contents = JSON.parse(e.postData.contents);
    const action = contents.action;
    const ss = SpreadsheetApp.getActiveSpreadsheet();

    // Route: Menyimpan Presensi / Jurnal KBM / Izin / Sakit
    if (action === "addRecord" || action === "addJournal") {
      let sheet = ss.getSheetByName(SHEET_PRESENSI);
      if (!sheet) {
        setupSheets();
        sheet = ss.getSheetByName(SHEET_PRESENSI);
      }

      const newId = `REC-${Date.now()}`;
      const timestamp = new Date().toLocaleString("id-ID");

      const status = contents.status || "Hadir";
      const detailMateriAlasan = status === "Hadir" ? (contents.materi || "-") : (contents.alasan || "-");

      sheet.appendRow([
        newId,
        timestamp,
        contents.teacherName || "-",
        status,
        contents.subject || "-",
        status === "Hadir" ? (contents.classId || "-") : "-",
        status === "Hadir" ? (contents.lessonHour || "-") : "-",
        status === "Hadir" ? (contents.jumlahHadir || "0") : "0",
        detailMateriAlasan,
        status === "Hadir" ? (contents.photoUrl || "-") : "-"
      ]);

      return createJsonResponse({
        status: "success",
        message: `Presensi (${status}) berhasil dicatat di Google Sheets`,
        id: newId
      });
    }

    return createJsonResponse({ status: "error", message: "Aksi POST tidak valid" });

  } catch (error) {
    return createJsonResponse({ status: "error", message: error.toString() });
  }
}
